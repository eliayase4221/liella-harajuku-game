<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Liella! 하라주쿠 대소동 - 팬게임 프로토타입</title>
<style>
  :root{
    --bg:#fff7fb;
    --panel:#ffffff;
    --ink:#24222a;
    --muted:#77727f;
    --accent:#f08ab6;
    --accent2:#8cc7ff;
    --line:#eadfe6;
    --shadow:0 18px 45px rgba(76,46,66,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 10%, #ffe7f2 0 18%, transparent 36%),
      radial-gradient(circle at 90% 0%, #e8f5ff 0 18%, transparent 35%),
      linear-gradient(180deg,#fffafd 0%,#fff7fb 100%);
  }
  .wrap{
    width:min(960px,100%);
    margin:0 auto;
    padding:18px;
  }
  .topbar{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    margin-bottom:14px;
  }
  .brand h1{font-size:clamp(22px,4vw,34px); margin:0; line-height:1.1}
  .brand p{margin:5px 0 0; color:var(--muted); font-size:13px}
  .actions{display:flex; gap:8px}
  button{
    border:0; border-radius:14px; padding:12px 16px; font-weight:700;
    cursor:pointer; transition:.15s transform,.15s opacity,.15s box-shadow;
    font-size:15px;
  }
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(1px)}
  .ghost{background:#fff; border:1px solid var(--line); color:#4c4850}
  .game{
    display:grid;
    grid-template-columns:260px 1fr;
    gap:16px;
  }
  .panel{
    background:rgba(255,255,255,.93);
    border:1px solid rgba(234,223,230,.95);
    border-radius:24px;
    box-shadow:var(--shadow);
  }
  .side{padding:18px; align-self:start}
  .stats{display:grid; gap:12px}
  .stat{
    display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center;
    padding-bottom:10px; border-bottom:1px dashed var(--line);
  }
  .stat:last-child{border-bottom:0}
  .stat span{font-size:14px; color:var(--muted)}
  .stat b{font-size:18px}
  .mini-title{font-size:13px; color:var(--muted); margin:18px 0 8px}
  .log{
    font-size:12px; color:#69636e; line-height:1.55; max-height:230px; overflow:auto;
    background:#fff8fb; border-radius:14px; padding:10px;
  }

  .main{min-height:650px; overflow:hidden; position:relative}
  .scene{
    min-height:650px;
    padding:24px;
    display:flex; flex-direction:column;
    position:relative;
  }
  .location{
    position:absolute; right:20px; top:18px;
    background:#ffffffcc; border:1px solid var(--line);
    border-radius:999px; padding:7px 11px;
    font-size:12px; color:#5b5660;
  }
  .stage{
    display:flex; align-items:flex-end; justify-content:center;
    gap:20px; min-height:245px; padding-top:18px;
  }
  .char{
    width:140px; text-align:center;
    animation:pop .25s ease-out;
  }
  .avatar{
    width:130px; height:130px; margin:auto;
    border-radius:32px;
    display:grid; place-items:center;
    font-size:48px; font-weight:900; color:#fff;
    box-shadow:0 14px 30px rgba(0,0,0,.12);
    border:5px solid #fff;
  }
  .char .name{
    display:inline-block; margin-top:10px; padding:5px 10px; border-radius:999px;
    background:#fff; font-weight:800; font-size:14px; border:1px solid var(--line);
  }
  .natsumi .avatar{background:linear-gradient(145deg,#ffb13b,#ff7d38)}
  .kuku .avatar{background:linear-gradient(145deg,#7fd4ff,#73aaff)}
  .kanon .avatar{background:linear-gradient(145deg,#ff8f91,#ff6f78)}
  @keyframes pop{from{opacity:0; transform:scale(.94) translateY(8px)}to{opacity:1; transform:none}}

  .dialogue{
    margin-top:auto;
    background:#fff; border:1px solid var(--line);
    border-radius:22px; padding:18px;
    box-shadow:0 12px 30px rgba(84,55,72,.08);
  }
  .speaker{
    display:inline-block; font-weight:900; font-size:14px;
    background:#f8edf3; border-radius:999px; padding:6px 10px; margin-bottom:10px;
  }
  .text{
    font-size:clamp(16px,2.4vw,20px);
    line-height:1.65; min-height:72px; white-space:pre-line;
  }
  .choices{display:grid; gap:9px; margin-top:16px}
  .choice{
    text-align:left; background:#fff8fb; border:1px solid #efdce6; color:#332f36;
  }
  .choice:hover{box-shadow:0 8px 22px rgba(240,138,182,.14); border-color:#eeb1cc}
  .footer-note{margin-top:12px; font-size:11px; color:#8a8490; text-align:center}
  .ending{
    display:none; padding:24px; text-align:center;
    min-height:650px; place-items:center;
  }
  .ending.on{display:grid}
  .ending-card{
    max-width:560px;
    background:#fff; border:1px solid var(--line); border-radius:28px;
    padding:30px; box-shadow:var(--shadow);
  }
  .ending h2{font-size:30px; margin:0 0 10px}
  .ending p{line-height:1.7; color:#5f5964}
  .ending .big{font-size:64px; margin-bottom:10px}
  .ending .result{
    margin:18px 0; background:#fff7fb; border-radius:18px; padding:14px; font-weight:800
  }
  @media (max-width:760px){
    .game{grid-template-columns:1fr}
    .side{order:2}
    .main{order:1; min-height:600px}
    .scene,.ending{min-height:600px}
    .stage{min-height:210px; gap:10px}
    .char{width:105px}
    .avatar{width:96px;height:96px;border-radius:26px;font-size:36px}
    .topbar{align-items:flex-start}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <h1>Liella! 하라주쿠 대소동</h1>
      <p>비공식 팬게임 프로토타입 · 10분 내외 · 설치 불필요</p>
    </div>
    <div class="actions">
      <button class="ghost" onclick="saveGame()">저장</button>

  </div>

오늘 목표는 딱 하나. 조용히 굿즈만 사고 돌아가는 것.</div>

</div>

function parseAction(action){
  const parts = action.split(";");
  let next = null;
  for(const p of parts){
    if(p.startsWith("+n")) state.natsumi += Number(p.slice(2));
    else if(p.startsWith("-n")) state.natsumi -= Number(p.slice(2));
    else if(p.startsWith("+k")) state.kuku += Number(p.slice(2));
    else if(p.startsWith("-k")) state.kuku -= Number(p.slice(2));
    else if(p.startsWith("+c")) state.kanon += Number(p.slice(2));
    else if(p.startsWith("-c")) state.kanon -= Number(p.slice(2));
    else if(p.startsWith("+m")) state.money += Number(p.slice(2));
    else if(p.startsWith("-m")) state.money -= Number(p.slice(2));
    else if(p.startsWith("+e")) state.energy = Math.min(5,state.energy+Number(p.slice(2)));
    else if(p.startsWith("-e")) state.energy = Math.max(0,state.energy-Number(p.slice(2)));
    else if(p==="video") state.flags.video=true;
    else if(p==="melon") state.flags.melon=true;
    else if(p==="escape") state.flags.escape=true;
    else next = p;
  }
  state.money = Math.max(0,state.money);
  if(next==="END") return finish();
  if(next){
    state.node = next;
    const n = nodes[next];
    if(n) state.log.push(`${n.location}: ${n.speaker}`);
  }
  render();
}

  const map = {
    natsumi:["나", "오니츠카 나츠미","natsumi"],
    kuku:["쿠","탕 쿠쿠","kuku"],
    kanon:["카","시부야 카논","kanon"]
  };
  const [letter,name,cls] = map[id];
  return `<div class="char ${cls}">
    <div class="avatar">${letter}</div>
    <div class="name">${name}</div>
  </div>`;
}

function render(){
  const n = nodes[state.node];
  document.getElementById("sceneBox").style.display="flex";
  document.getElementById("endingBox").classList.remove("on");
  document.getElementById("locationTag").textContent=n.location;
  document.getElementById("speaker").textContent=n.speaker;
  document.getElementById("text").textContent=n.text;
  document.getElementById("stage").innerHTML=(n.chars||[]).map(charHTML).join("");

  const choiceBox=document.getElementById("choices");
  choiceBox.innerHTML="";
  n.choices.forEach(([label,action])=>{
    const b=document.createElement("button");
    b.className="choice";
    b.textContent=label;
    b.onclick=()=>parseAction(action);
    choiceBox.appendChild(b);
  });

  updateStats();
}

function updateStats(){
  document.getElementById("natsumiStat").textContent=state.natsumi;
  document.getElementById("kukuStat").textContent=state.kuku;
  document.getElementById("kanonStat").textContent=state.kanon;
  document.getElementById("moneyStat").textContent=state.money;
  document.getElementById("energyStat").textContent=state.energy;
  document.getElementById("logBox").innerHTML=state.log.slice(-8).map(x=>`• ${x}`).join("<br>");
}

function finish(){
  let title="", text="", emoji="🎉";
  const max = Math.max(state.natsumi,state.kuku,state.kanon);

  if(state.money===0){
    title="하라주쿠 파산 엔딩";
    emoji="💸";
    text="즐거운 하루였지만 통장에는 아무것도 남지 않았다. 다음 여행에서는 예산을 먼저 정하자.";
  } else if(state.energy===0){
    title="체력 방전 엔딩";
    emoji="🪫";
    text="끝까지 버티긴 했지만 하라주쿠역 의자에 앉자마자 움직일 수 없게 됐다.";
  } else if(state.natsumi===max && state.natsumi>=4){
    title="나츠미 전속 촬영 스태프 엔딩";
    emoji="🧡";
    text="나츠미에게 다음 영상 촬영도 같이 하자는 연락이 왔다. 출연료 협상은 아직 끝나지 않았다.";
  } else if(state.kuku===max && state.kuku>=4){
    title="쿠쿠와 하라주쿠 디저트 투어 엔딩";
    emoji="💙";
    text="쿠쿠에게 다음번에는 더 맛있는 곳을 알려주겠다는 메시지가 왔다. 지갑이 조금 걱정된다.";
  } else if(state.kanon===max && state.kanon>=4){
    title="Liella! 연습실 단골 엔딩";
    emoji="❤️";
    text="카논이 다음에도 시간 되면 놀러 오라고 했다. 조용한 하루는 아니었지만 나쁘지 않았다.";
  } else if(state.flags.escape && state.natsumi<0){
    title="나츠미에게 찍힌 사람 엔딩";
    emoji="🏃";
    text="하라주쿠 골목에서 주황색 머리카락만 보여도 반사적으로 방향을 틀게 됐다.";
  } else {
    title="평범하게(?) 즐거운 하루 엔딩";
    emoji="✨";
    text="큰 사건 없이 하루가 끝났다. 하지만 다음번에도 이런 일이 없으리라는 보장은 없다.";
  }

  document.getElementById("sceneBox").style.display="none";
  document.getElementById("endingBox").classList.add("on");
  document.getElementById("endingEmoji").textContent=emoji;
  document.getElementById("endingTitle").textContent=title;
  document.getElementById("endingText").textContent=text;
  document.getElementById("endingResult").textContent=
    `나츠미 ${state.natsumi} · 쿠쿠 ${state.kuku} · 카논 ${state.kanon} · 남은 돈 ${state.money}엔 · 체력 ${state.energy}/5`;

  state.log.push(`엔딩: ${title}`);
  updateStats();
}

function saveGame(){
  localStorage.setItem("liellaHarajukuSave",JSON.stringify(state));
  alert("저장 완료!");
}

function loadGame(){
  const saved=localStorage.getItem("liellaHarajukuSave");
  if(saved){
    try{
      state=JSON.parse(saved);
      if(!nodes[state.node]) state=initialState();
    }catch(e){ state=initialState(); }
  }
  render();
}

function resetGame(){
  if(confirm("처음부터 다시 할까?")){
    state=initialState();
    localStorage.removeItem("liellaHarajukuSave");
    render();
  }
}

loadGame();
</script>
</body>
</html>
